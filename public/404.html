<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Portfolio Redirecting...</title>
    <script type="text/javascript">
      /**
       * GitHub Pages SPA Router Hack
       * This script takes the current URL (which GitHub thinks is a 404)
       * and converts it into a query string that index.html can read.
       */
      var pathSegmentsToKeep = 1; // Set to 1 if your repo is at username.github.io/repo-name/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- Empty body, user is redirected instantly -->
  </body>
</html>
